<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - Study Schedule Optimizer</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
            color: #ffffff;
            padding: 26px 24px;
            text-align: center;
        }
        .auth-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .auth-header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .auth-body {
            padding: 24px;
        }
        .role-tabs {
            display: flex;
            background-color: var(--bg-light);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .role-tab {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .role-tab.active {
            background-color: #ffffff;
            color: var(--primary-blue);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Register as a Student or Faculty Member</p>
        </div>

        <div class="auth-body">
            <!-- Role Toggle -->
            <div class="role-tabs">
                <div id="tabStudent" class="role-tab active" onclick="setRole('STUDENT')">👨‍🎓 Student Signup</div>
                <div id="tabFaculty" class="role-tab" onclick="setRole('FACULTY')">👨‍🏫 Faculty Signup</div>
            </div>

            <div id="signupAlert" class="alert"></div>

            <form id="signupForm">
                <input type="hidden" id="roleInput" value="STUDENT">

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="e.g. Ananya Sen" required>
                </div>

                <!-- Student Roll Number Field (Visible only for Students) -->
                <div class="form-group" id="rollGroup" style="margin-bottom: 12px;">
                    <label for="rollNumber">Roll Number *</label>
                    <input type="text" id="rollNumber" placeholder="e.g. 24CS009">
                    <small>Your unique college roll number.</small>
                </div>

                <!-- Faculty Department Field (Visible only for Faculty) -->
                <div class="form-group" id="deptGroup" style="margin-bottom: 12px; display: none;">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="e.g. Computer Science & Engg">
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" placeholder="e.g. ananya@college.edu" required>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="username">Username *</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Minimum 4 characters" minlength="4" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
                    ✨ Create Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted);">
                Already have an account? <a href="/login.html" style="color: var(--primary-blue); font-weight: 600; text-decoration: none;">Sign In here</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        function setRole(role) {
            document.getElementById('roleInput').value = role;
            document.getElementById('tabStudent').className = role === 'STUDENT' ? 'role-tab active' : 'role-tab';
            document.getElementById('tabFaculty').className = role === 'FACULTY' ? 'role-tab active' : 'role-tab';

            if (role === 'STUDENT') {
                document.getElementById('rollGroup').style.display = 'flex';
                document.getElementById('deptGroup').style.display = 'none';
            } else {
                document.getElementById('rollGroup').style.display = 'none';
                document.getElementById('deptGroup').style.display = 'flex';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('roleInput').value;
            const fullName = document.getElementById('fullName').value.trim();
            const roll = document.getElementById('rollNumber').value.trim();
            const dept = document.getElementById('department').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (role === 'STUDENT' && !roll) {
                showAlert('signupAlert', 'Roll Number is required for student registration.', false);
                return;
            }

            try {
                const response = await API.signup({
                    role,
                    fullName,
                    rollNumber: role === 'STUDENT' ? roll : null,
                    department: role === 'FACULTY' ? dept : null,
                    email,
                    username,
                    password
                });

                showAlert('signupAlert', 'Account created successfully! Redirecting...', true);
                setTimeout(() => {
                    window.location.href = response.redirectUrl;
                }, 800);

            } catch (err) {
                showAlert('signupAlert', err.message, false);
            }
        });
    </script>
</body>
</html>
