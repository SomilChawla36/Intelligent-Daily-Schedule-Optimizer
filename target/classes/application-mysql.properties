# ==============================================================================
# SPRING BOOT - MYSQL PRODUCTION PROFILE
# Activate using: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar target/schedule-optimizer-1.0.0.jar --spring.profiles.active=mysql
# ==============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/schedule_optimizer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
