# ==============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# Default Mode: In-Memory Database (MySQL Mode emulation)
# Allows zero-configuration, instant execution for viva/testing
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=Intelligent Daily Schedule Optimizer

# In-Memory DataSource (MySQL Compatible Syntax)
spring.datasource.url=jdbc:h2:mem:schedule_optimizer_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automatic schema.sql execution since Hibernate ddl-auto creates all tables
spring.sql.init.mode=never

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Static Frontend Assets (HTML/CSS/JS)
spring.web.resources.static-locations=classpath:/static/

# Optional: H2 Web Console for inspecting database tables
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
